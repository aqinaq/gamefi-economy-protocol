name: CI

on:
  push:
  pull_request:

jobs:
  foundry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Test
        run: forge test --match-path "contracts/test/*"

      - name: Coverage
        run: forge coverage --match-path "contracts/test/*" --report summary --no-match-coverage "contracts/lib/*"
